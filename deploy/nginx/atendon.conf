map $uri $atendon_login_limit_key {
    default "";
    /api/auth/login $binary_remote_addr;
}

map $uri $atendon_webhook_limit_key {
    default "";
    /api/webhooks/evolution $binary_remote_addr;
}

map $http_upgrade $atendon_upgrade_connection {
    default upgrade;
    '' close;
}

limit_req_zone $atendon_login_limit_key zone=atendon_login:10m rate=10r/m;
limit_req_zone $atendon_webhook_limit_key zone=atendon_webhook:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=atendon_per_ip:10m;

server {
    listen 80;
    listen [::]:80;
    server_name atendon.alpdash.com.br;
    server_tokens off;
    client_max_body_size 46m;
    client_header_timeout 15s;
    client_body_timeout 60s;
    keepalive_timeout 30s;
    send_timeout 75s;
    reset_timedout_connection on;

    limit_conn atendon_per_ip 50;
    limit_req zone=atendon_login burst=10 nodelay;
    limit_req zone=atendon_webhook burst=100 nodelay;
    limit_req_status 429;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'self' https://meet.atendon.alpdash.com.br; form-action 'self'; script-src 'self' 'unsafe-inline' https://meet.atendon.alpdash.com.br; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' blob:; connect-src 'self' https: wss:" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self \"https://meet.atendon.alpdash.com.br\"), microphone=(self \"https://meet.atendon.alpdash.com.br\"), display-capture=(self \"https://meet.atendon.alpdash.com.br\"), fullscreen=(self \"https://meet.atendon.alpdash.com.br\"), geolocation=()" always;

    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        internal;
        root /var/www/apps/atendon/deploy/nginx/error-pages;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3110/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location = /api/events {
        proxy_pass http://127.0.0.1:3110/events;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_send_timeout 75s;
    }

    location / {
        if (-f /var/www/apps/atendon/deploy/nginx/maintenance.flag) {
            return 503;
        }
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}


server {
    listen 80;
    listen [::]:80;
    server_name meet.atendon.alpdash.com.br;
    server_tokens off;
    client_max_body_size 10m;
    client_header_timeout 15s;
    client_body_timeout 60s;
    keepalive_timeout 30s;
    send_timeout 1h;
    reset_timedout_connection on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "frame-ancestors https://atendon.alpdash.com.br" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), fullscreen=(self), geolocation=()" always;

    location / {
        proxy_pass http://127.0.0.1:8444;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $atendon_upgrade_connection;
        proxy_hide_header X-Frame-Options;
        # The edge owns embedding/capture policy. Avoid restrictive intersections
        # if a pinned Jitsi image starts emitting either header by default.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
